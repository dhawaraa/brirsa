<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // --- CONFIGURATION ---
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyos5CMsg89JTHAfJo6JgUf53bMox_AwM5vqq3AfvXAj1wwo6L3Rfla1v8A6KJZQVOw9w/exec";
        const LOGO_URL = "https://newbri.mcu.ac.th/wp-content/uploads/2025/10/mcu-logo-Large-Phone.png";

        // รายชื่อสังกัด
        const AFFILIATIONS = [
            "คณะพุทธศาสตร์", "คณะครุศาสตร์", "คณะมนุษยศาสตร์", "คณะสังคมศาสตร์", "บัณฑิตวิทยาลัย",
            "วิทยาลัยพุทธศาสตร์นานาชาติ", "วิทยาลัยธรรมทูต", 
            "สถาบันวิจัยพุทธศาสตร์", 
            "วิทยาเขตหนองคาย", "วิทยาเขตนครศรีธรรมราช",
            "วิทยาเขตเชียงใหม่", "วิทยาเขตขอนแก่น", "วิทยาเขตนครราชสีมา", "วิทยาเขตอุบลราชธานี",
            "วิทยาเขตแพร่", "วิทยาเขตสุรินทร์", "วิทยาเขตพะเยา", "วิทยาเขตบาฬีศึกษาพุทธโฆส",
            "วิทยาเขตนครสวรรค์", "วิทยาเขตนครน่านเฉลิมพระเกียรติฯ", "วิทยาลัยสงฆ์ลำพูน", "วิทยาลัยสงฆ์เลย",
            "วิทยาลัยสงฆ์นครพนม", "วิทยาลัยสงฆ์พุทธชินราช", "วิทยาลัยสงฆ์บุรีรัมย์", "วิทยาลัยสงฆ์ปัตตานี",
            "วิทยาลัยสงฆ์พุทธโสธร", "วิทยาลัยสงฆ์เชียงราย", "วิทยาลัยสงฆ์นครลำปาง", "วิทยาลัยสงฆ์ศรีสะเกษ",
            "วิทยาลัยสงฆ์พุทธปัญญาศรีทวารวดี", "วิทยาลัยสงฆ์ชัยภูมิ", "วิทยาลัยสงฆ์พ่อขุนผาเมือง",
            "วิทยาลัยสงฆ์ร้อยเอ็ด", "วิทยาลัยสงฆ์ราชบุรี", "วิทยาลัยสงฆ์สุพรรณบุรีศรีสุวรรณภูมิ",
            "วิทยาลัยสงฆ์พิจิตร", "วิทยาลัยสงฆ์สุราษฎร์ธานี", "วิทยาลัยสงฆ์ระยอง", "วิทยาลัยสงฆ์มหาสารคาม",
            "วิทยาลัยสงฆ์เพชรบุรี", "วิทยาลัยสงฆ์อุทัยธานี", "วิทยาลัยสงฆ์กาญจนบุรี ศรีไพบุลย์",
            "วิทยาลัยสงฆ์ชลบุรี", "วิทยาลัยสงฆ์จันทบุรี", "วิทยาลัยสงฆ์กำแพงเพชร", "วิทยาลัยสงฆ์ตาก",
            "หน่วยวิทยบริการจังหวัดอุตรดิตถ์", "หน่วยวิทยบริการจังหวัดสระแก้ว", "หน่วยวิทยบริการจังหวัดสงขลา",
            "หน่วยวิทยบริการจังหวัดสมุทรสงคราม", "หน่วยวิทยบริการจังหวัดกาฬสินธุ์", "ห้องเรียนจังหวัดสิงห์บุรี",
            "มหาวชิราลงกรณบาลีเถรวาทราชวิทยาลัย"
        ];
        
        const FILE_LABELS = {
            'file_report': '1. รายงานวิจัยฉบับสมบูรณ์',
            'file_self_assess': '2. แบบประเมินตนเอง',
            'file_sp10': '3. บันทึกข้อความ สวพ.10',
            'file_sp10_1': '4. แบบฟอร์มตรวจ สวพ.10.1',
            'file_cert': '5. เอกสารรับรองการตีพิมพ์',
            'file_plagiarism': '6. หลักฐานตรวจอักขราวิสุทธิ์',
            'file_rs_cert': 'ใบรับรองงานวิจัย (Official)',
            'file_correction': 'เอกสารแจ้งแก้ไข'
        };

        const Icon = ({ name, size = 20, className = "" }) => {
            const containerRef = useRef(null);
            useEffect(() => {
                const container = containerRef.current;
                if (!container || !window.lucide) return;
                container.innerHTML = '';
                try {
                    const iconDef = window.lucide.icons[name];
                    if (iconDef && typeof window.lucide.createElement === 'function') {
                        const svg = window.lucide.createElement(iconDef);
                        svg.setAttribute('width', size);
                        svg.setAttribute('height', size);
                        const baseClass = svg.getAttribute('class') || '';
                        if (className) svg.setAttribute('class', (baseClass + ' ' + className).trim());
                        container.appendChild(svg);
                    }
                } catch (err) { console.error(`Icon error: ${name}`, err); }
            }, [name, size, className]);
            return <span ref={containerRef} className="inline-flex items-center justify-center leading-none" />;
        };

        const STATUS_OPTIONS = {
            'checking': { label: '1. เจ้าหน้าที่ตรวจสอบเอกสาร', color: 'bg-blue-100 text-blue-800 border-blue-200', icon: 'FileText' },
            'committee': { label: '2. เสนอกรรมการพิจารณา', color: 'bg-purple-100 text-purple-800 border-purple-200', icon: 'Users' },
            'correction': { label: '3. ส่งกลับให้นักวิจัยแก้ไข', color: 'bg-orange-100 text-orange-800 border-orange-200', icon: 'Edit3' },
            'rejected': { label: '4. ไม่รับรอง', color: 'bg-red-100 text-red-800 border-red-200', icon: 'X' },
            'approved': { label: '5. อนุมัติรับรอง', color: 'bg-green-100 text-green-800 border-green-200', icon: 'CheckCircle' }
        };

        const fileToBase64 = (file) => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve({ name: file.name, type: file.type, data: reader.result.split(',')[1] });
            reader.onerror = error => reject(error);
        });

        const api = {
            fetchData: async () => {
                try {
                    const res = await fetch(GOOGLE_SCRIPT_URL);
                    const data = await res.json();
                    return Array.isArray(data) ? data : [];
                } catch (e) { return []; }
            },
            submitData: async (payload) => {
                const res = await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                return await res.json();
            }
        };

        const SearchableDropdown = ({ options, value, onChange, placeholder, name }) => {
            const [isOpen, setIsOpen] = useState(false);
            const [searchTerm, setSearchTerm] = useState('');
            const wrapperRef = useRef(null);

            useEffect(() => { if (isOpen) setSearchTerm(value || ''); }, [isOpen]);
            useEffect(() => {
                function handleClickOutside(event) {
                    if (wrapperRef.current && !wrapperRef.current.contains(event.target)) setIsOpen(false);
                }
                document.addEventListener("mousedown", handleClickOutside);
                return () => document.removeEventListener("mousedown", handleClickOutside);
            }, [wrapperRef]);

            const filteredOptions = options.filter(option => option.toLowerCase().includes(searchTerm.toLowerCase()));

            return (
                <div className="relative" ref={wrapperRef}>
                    <div className="relative">
                        <input
                            type="text"
                            className="w-full px-3 py-2 border border-gray-300 rounded-md outline-none focus:border-pink-500 focus:ring-2 focus:ring-pink-200 transition-colors pr-8 text-gray-700"
                            placeholder={placeholder}
                            value={isOpen ? searchTerm : (value || '')}
                            onChange={(e) => setSearchTerm(e.target.value)}
                            onFocus={() => setIsOpen(true)}
                            onClick={() => setIsOpen(true)}
                        />
                        <div className="absolute right-3 top-2.5 text-gray-400 pointer-events-none"><Icon name="ChevronDown" size={16} /></div>
                    </div>
                    {isOpen && (
                        <div className="absolute z-20 w-full mt-1 bg-white border border-gray-300 rounded-md shadow-lg max-h-60 overflow-y-auto">
                            {filteredOptions.length > 0 ? (
                                filteredOptions.map((option, idx) => (
                                    <div key={idx} className="px-4 py-2 hover:bg-pink-50 cursor-pointer text-sm text-gray-700" onClick={() => { onChange({ target: { name, value: option } }); setIsOpen(false); }}>{option}</div>
                                ))
                            ) : (<div className="px-4 py-2 text-sm text-gray-500">ไม่พบข้อมูล</div>)}
                        </div>
                    )}
                </div>
            );
        };

        // --- AUTH & UI COMPONENTS ---
        const LoginModal = ({ isOpen, onClose, onLogin }) => {
            const [password, setPassword] = useState('');
            const [showPassword, setShowPassword] = useState(false);
            
            if (!isOpen) return null;
            
            const handleSubmit = (e) => { 
                e.preventDefault(); 
                if (password === 'mcubri@2025') { 
                    onLogin(); 
                    onClose(); 
                    setPassword(''); 
                } else { 
                    alert('รหัสผ่านไม่ถูกต้อง'); 
                } 
            };
            
            return (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
                    <div className="bg-white rounded-lg p-6 w-full max-w-sm shadow-xl">
                        <div className="text-center mb-6">
                            <div className="bg-gray-100 p-3 rounded-full inline-block mb-2">
                                <Icon name="Lock" size={32} className="text-gray-700" />
                            </div>
                            <h3 className="text-xl font-bold text-gray-800">เข้าสู่ระบบผู้ดูแลระบบ</h3>
                        </div>
                        <form onSubmit={handleSubmit}>
                            <div className="mb-4 relative">
                                <Icon name="KeyRound" size={18} className="absolute left-3 top-2.5 text-gray-400" />
                                <input type={showPassword ? "text" : "password"} value={password} onChange={(e) => setPassword(e.target.value)} className="w-full pl-10 pr-10 py-2 border rounded focus:ring-2 focus:ring-blue-500 outline-none" placeholder="กรอกรหัสผ่าน" />
                                <button type="button" onClick={() => setShowPassword(!showPassword)} className="absolute right-3 top-2.5 text-gray-400"><Icon name={showPassword ? "EyeOff" : "Eye"} size={18} /></button>
                            </div>
                            <div className="flex space-x-3">
                                <button type="button" onClick={onClose} className="flex-1 py-2 border rounded">ยกเลิก</button>
                                <button type="submit" className="flex-1 py-2 bg-[#1a237e] text-white rounded">เข้าสู่ระบบ</button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        };

        // --- NEW: FULL EDIT MODAL ---
        const EditRequestModal = ({ isOpen, onClose, request, onSave }) => {
            const [data, setData] = useState({});
            const [newFiles, setNewFiles] = useState({});
            const [isSaving, setIsSaving] = useState(false);
            
            useEffect(() => { 
                if (request) {
                    setData({...request});
                    setNewFiles({}); // Reset files
                }
            }, [request]);
            
            if (!isOpen) return null;
            
            const handleChange = (e) => setData({ ...data, [e.target.name]: e.target.value });
            
            const handleFileChange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    if (file.type !== 'application/pdf') return alert('กรุณาเลือกไฟล์ PDF เท่านั้น');
                    setNewFiles({...newFiles, [e.target.name]: file});
                }
            };

            const handleSaveClick = async () => {
                setIsSaving(true);
                try {
                    // Prepare Payload
                    const payload = { ...data };
                    
                    // Convert files to base64 if any
                    if (Object.keys(newFiles).length > 0) {
                        const processedFiles = await Promise.all(
                            Object.entries(newFiles).map(async ([k, v]) => ({ 
                                field: k, 
                                ...(await fileToBase64(v)) 
                            }))
                        );
                        payload.files = processedFiles;
                    }
                    
                    await onSave(payload);
                } catch (e) {
                    alert('Error preparing data: ' + e.message);
                } finally {
                    setIsSaving(false);
                }
            };
            
            return (
                <div className="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-50 p-4">
                    <div className="bg-white rounded-xl shadow-2xl w-full max-w-4xl overflow-hidden flex flex-col max-h-[90vh]">
                        <div className="bg-[#1a237e] px-6 py-4 text-white flex justify-between items-center">
                            <h3 className="text-lg font-bold flex items-center"><Icon name="Edit3" className="mr-2"/> แก้ไขข้อมูลคำขอ</h3>
                            <button onClick={onClose}><Icon name="X" size={24}/></button>
                        </div>
                        <div className="p-6 overflow-y-auto">
                            <div className="grid md:grid-cols-2 gap-4 mb-6">
                                {/* TEXT FIELDS */}
                                <div><label className="text-xs font-bold text-gray-500">ชื่อ-นามสกุล</label><input name="name" value={data.name||''} onChange={handleChange} className="w-full border p-2 rounded text-sm"/></div>
                                <div><label className="text-xs font-bold text-gray-500">ชื่อโครงการ</label><input name="project_title" value={data.project_title||''} onChange={handleChange} className="w-full border p-2 rounded text-sm"/></div>
                                <div><label className="text-xs font-bold text-gray-500">ปีงบประมาณ</label><input name="fiscal_year" value={data.fiscal_year||''} onChange={handleChange} className="w-full border p-2 rounded text-sm"/></div>
                                <div>
                                    <label className="text-xs font-bold text-gray-500">สังกัด</label>
                                    <select name="affiliation" value={data.affiliation||''} onChange={handleChange} className="w-full border p-2 rounded text-sm">
                                        <option value="">-- เลือก --</option>
                                        {AFFILIATIONS.map(a=><option key={a} value={a}>{a}</option>)}
                                    </select>
                                </div>
                                <div><label className="text-xs font-bold text-gray-500">ตำแหน่งทางวิชาการ</label><input name="academic_position" value={data.academic_position||''} onChange={handleChange} className="w-full border p-2 rounded text-sm"/></div>
                                <div><label className="text-xs font-bold text-gray-500">สาขา</label><input name="branch" value={data.branch||''} onChange={handleChange} className="w-full border p-2 rounded text-sm"/></div>
                                <div><label className="text-xs font-bold text-gray-500">อีเมล</label><input name="email" value={data.email||''} onChange={handleChange} className="w-full border p-2 rounded text-sm"/></div>
                                <div><label className="text-xs font-bold text-gray-500">โทรศัพท์</label><input name="tel" value={data.tel||''} onChange={handleChange} className="w-full border p-2 rounded text-sm"/></div>
                                <div><label className="text-xs font-bold text-gray-500">ชื่อวารสาร</label><input name="journal_name" value={data.journal_name||''} onChange={handleChange} className="w-full border p-2 rounded text-sm"/></div>
                                <div><label className="text-xs font-bold text-gray-500">% การคัดลอก</label><input name="plagiarism_percent" value={data.plagiarism_percent||''} onChange={handleChange} className="w-full border p-2 rounded text-sm"/></div>
                            </div>

                            {/* FILE UPLOADS */}
                            <h4 className="font-bold text-gray-700 border-b pb-2 mb-4">อัปเดตไฟล์แนบ (เลือกไฟล์ใหม่เพื่อแทนที่เดิม)</h4>
                            <div className="grid md:grid-cols-2 gap-4">
                                {['file_report', 'file_self_assess', 'file_sp10', 'file_sp10_1', 'file_cert', 'file_plagiarism'].map(key => (
                                    <div key={key} className="border p-3 rounded bg-gray-50">
                                        <div className="flex justify-between items-center mb-2">
                                            <span className="text-sm font-bold text-gray-600">{FILE_LABELS[key]}</span>
                                            {data[key] && <a href={data[key]} target="_blank" className="text-xs text-blue-600 underline">ดูไฟล์เดิม</a>}
                                        </div>
                                        <input type="file" name={key} accept=".pdf" onChange={handleFileChange} className="text-xs w-full"/>
                                        {newFiles[key] && <div className="text-xs text-green-600 mt-1">จะถูกอัปโหลด: {newFiles[key].name}</div>}
                                    </div>
                                ))}
                            </div>
                        </div>
                        <div className="p-4 border-t bg-gray-50 flex justify-end space-x-2">
                            <button onClick={onClose} disabled={isSaving} className="px-4 py-2 border rounded text-gray-600">ยกเลิก</button>
                            <button onClick={handleSaveClick} disabled={isSaving} className={`px-4 py-2 bg-blue-600 text-white rounded font-bold ${isSaving ? 'opacity-50' : 'hover:bg-blue-700'}`}>
                                {isSaving ? 'กำลังบันทึก...' : 'บันทึกการแก้ไข'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const SuccessModal = ({ isOpen, onClose, data }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-50 p-4 animate-fade-in">
                    <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden relative">
                        <div className="bg-green-600 h-2"></div>
                        <div className="p-8 text-center">
                            <div className="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6"><Icon name="CheckCircle" size={48} className="text-green-600" /></div>
                            <h3 className="text-2xl font-bold text-gray-900 mb-2">ดำเนินการสำเร็จ!</h3>
                            <p className="text-gray-600 mb-6">ระบบได้บันทึกข้อมูลเรียบร้อยแล้ว</p>
                            <button onClick={onClose} className="w-full py-3 bg-green-600 text-white font-bold rounded-lg hover:bg-green-700">ตกลง</button>
                        </div>
                    </div>
                </div>
            );
        };

        const ProgressModal = ({ isOpen, progress, text = "กำลังส่งข้อมูล..." }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center z-50 p-4">
                    <div className="bg-white rounded-xl shadow-xl p-8 w-full max-w-sm text-center">
                        <div className="mb-4 flex justify-center"><div className="animate-spin rounded-full h-12 w-12 border-b-2 border-[#1a237e]"></div></div>
                        <h3 className="text-lg font-bold text-gray-800 mb-2">{text}</h3>
                        <p className="text-sm text-gray-500 mb-4">กรุณารอสักครู่ ห้ามปิดหน้านี้</p>
                        <div className="w-full bg-gray-200 rounded-full h-2.5 mb-2"><div className="bg-[#1a237e] h-2.5 rounded-full transition-all duration-300" style={{ width: `${progress}%` }}></div></div>
                        <p className="text-xs text-gray-400 text-right">{progress}%</p>
                    </div>
                </div>
            );
        };
        
        // --- NAVBAR ---
        const Navbar = ({ activeTab, setActiveTab, isAdmin, setIsAdmin }) => { 
            const [showLogin, setShowLogin] = useState(false); 
            const [isMenuOpen, setIsMenuOpen] = useState(false); 
            
            const handleLogout = () => {
                setIsAdmin(false);
                setActiveTab('home');
            }; 
            
            return (
                <React.Fragment>
                    <nav className={`border-b sticky top-0 z-40 shadow-sm transition-colors duration-300 ${isAdmin?'bg-gray-900 border-gray-700 text-white':'bg-white border-gray-200 text-[#1a237e]'}`}>
                        <div className="max-w-7xl mx-auto px-4 h-20 flex justify-between items-center">

                 if (requests.some(r => r.project_title?.trim() === formData.project_title.trim())) return alert('ชื่อโครงการนี้มีอยู่ในระบบแล้ว กรุณาตรวจสอบ');

        // --- STATUS CHECK (UPDATED) ---
        const StatusCheck = ({ requests, initialSearchId }) => {
            const [searchTerm, setSearchTerm] = useState('');
            const [results, setResults] = useState([]);
            
            useEffect(() => {
                if (initialSearchId) {
                    setSearchTerm(initialSearchId);
                    const found = requests.filter(r => r.id?.toLowerCase() === initialSearchId.toLowerCase());
                    if (found.length > 0) setResults(found);
                }
            }, [initialSearchId, requests]);

            const handleSearch = (e) => { 
                e.preventDefault(); 
                if(!searchTerm.trim()) return setResults([]); 
                setResults(requests.filter(r => (r.id?.toLowerCase() === searchTerm.toLowerCase()))); 
            };
            
            return (
                <div className="max-w-4xl mx-auto px-4 py-12">

                        </div>
                        <button className="px-6 py-3 bg-[#1a237e] text-white rounded-lg">ค้นหา</button>
                    </form>
                    <div className="space-y-4">
                        {results.length > 0 ? results.map((req, idx) => (
                            <div key={idx} className={`bg-white p-6 rounded-lg shadow-sm border-l-4 ${(STATUS_OPTIONS[req.status] || STATUS_OPTIONS.checking).color.split(' ')[0]}`}>

                                    <span className={`px-3 py-1 rounded-full text-xs font-semibold border ${(STATUS_OPTIONS[req.status] || STATUS_OPTIONS.checking).color}`}>{(STATUS_OPTIONS[req.status] || STATUS_OPTIONS.checking).label}</span>
                                </div>
                                <p className="text-sm text-gray-600 mb-1">รหัส: {req.id} | ผู้วิจัย: {req.name}</p>

                                {req.status === 'approved' && req.file_rs_cert && ( 
                                    <div className="mt-4 p-3 bg-green-50 border border-green-200 rounded-lg flex justify-between items-center">
                                        <span className="text-green-800 font-bold flex items-center"><Icon name="Award" className="mr-2"/> ได้รับการรับรองแล้ว</span>
                                        <a href={req.file_rs_cert} target="_blank" className="px-4 py-2 bg-green-600 text-white text-sm font-bold rounded hover:bg-green-700 flex items-center shadow"><Icon name="Download" size={16} className="mr-2"/> ดาวน์โหลดใบรับรอง</a>
                                    </div> 
                                )}
                                
                                {req.status === 'correction' && ( 
                                    <div className="mt-4 p-4 bg-orange-50 border border-orange-200 rounded-lg">
                                        <div className="flex items-center gap-2 mb-2 text-orange-800 font-bold">
                                            <Icon name="Edit3" size={18}/> สิ่งที่ต้องแก้ไข
                                        </div>
                                        
                                        {req.correction_note && (
                                            <div className="text-sm text-gray-800 bg-white p-3 rounded border border-orange-100 mb-3 whitespace-pre-wrap">
                                                {req.correction_note}
                                            </div>
                                        )}

                                        {req.file_correction && (
                                            <div className="flex justify-end">
                                                <a href={req.file_correction} target="_blank" className="inline-flex items-center px-4 py-2 bg-orange-500 text-white text-sm font-bold rounded hover:bg-orange-600 shadow-sm transition-colors">
                                                    <Icon name="Download" size={16} className="mr-2"/> ดาวน์โหลดเอกสารแจ้งแก้ไข
                                                </a>
                                            </div>
                                        )}
                                    </div> 
                                )}
                            </div>
                        )) : searchTerm && <div className="text-center text-gray-500 py-8 bg-gray-50 rounded-lg border border-dashed">ไม่พบข้อมูลที่ตรงกัน</div>}
                    </div>
                </div>
            );
        };

        // --- ADMIN DASHBOARD (UPDATED WITH FILTERS & UPLOAD FIX) ---
        const AdminDashboard = ({ requests, refreshData }) => {
            const [expanded, setExpanded] = useState(null);
            
            // Filter States
            const [filterStatus, setFilterStatus] = useState('all');
            const [filterName, setFilterName] = useState('');
            const [filterAffiliation, setFilterAffiliation] = useState('');
            const [filterYear, setFilterYear] = useState('');

            const [isEditModalOpen, setIsEditModalOpen] = useState(false);
            const [editData, setEditData] = useState(null);
            
            // File Upload States
            const [uploadFile, setUploadFile] = useState(null);
            const [isUploading, setIsUploading] = useState(false);
            const [uploadProgress, setUploadProgress] = useState(0);
            
            // Textarea States for Correction Note
            const [correctionNotes, setCorrectionNotes] = useState({});

            // Extract unique years for dropdown
            const uniqueYears = useMemo(() => {
                const years = requests.map(r => r.fiscal_year).filter(Boolean);
                return [...new Set(years)].sort().reverse();
            }, [requests]);

            // Handle Correction Note Change
            const handleNoteChange = (rowId, value) => {
                setCorrectionNotes(prev => ({...prev, [rowId]: value}));
            };

            const handleUpdate = async (rowId, newStatus) => { 
                const req = requests.find(r => r.rowId === rowId);
                const note = correctionNotes[rowId] || req.correction_note || '';

                // VALIDATION: Correction
                if (newStatus === 'correction') {
                    if (!req.file_correction) {
                        alert('กรุณาอัปโหลด "ไฟล์แจ้งแก้ไข" ก่อนเปลี่ยนสถานะเป็นส่งกลับแก้ไข');
                        return; // Stop
                    }
                    if (!note.trim()) {
                        alert('กรุณาระบุ "บันทึกแจ้งนักวิจัย" ก่อนเปลี่ยนสถานะเป็นส่งกลับแก้ไข');
                        return; // Stop
                    }
                }

                // VALIDATION: Approved
                if (newStatus === 'approved') {
                    if (!req.file_rs_cert) {
                        alert('กรุณาอัปโหลด "ใบรับรองงานวิจัย" ก่อนเปลี่ยนสถานะเป็นอนุมัติ');
                        return; // Stop
                    }
                }

                if(confirm('ยืนยันเปลี่ยนสถานะและส่งเมลแจ้งเตือน?')) { 
                    await api.submitData({
                        action: 'update', 
                        rowId, 
                        status: newStatus,
                        correctionNote: note // Send the note along with status update
                    }); 
                    refreshData(); 
                    alert('สำเร็จ'); 
                } 
            };

            const handleDelete = async (rowId) => { 
                if(confirm('ยืนยันลบ?')) { 
                    await api.submitData({action:'delete', rowId}); 
                    refreshData(); 
                } 
            };
            
            const openEditModal = (req) => { setEditData(req); setIsEditModalOpen(true); };
            
            const handleSaveEdit = async (newData) => { 
                await api.submitData({ action: 'edit_data', ...newData }); 
                setIsEditModalOpen(false); 
                refreshData(); 
                alert('แก้ไขข้อมูลสำเร็จ'); 
            };

            const handleFileUpload = async (rowId, name, fiscal_year, type) => {
                if (!uploadFile) return alert('กรุณาเลือกไฟล์ก่อน');
                if (uploadFile.type !== 'application/pdf') return alert('กรุณาเลือกไฟล์ PDF เท่านั้น');
                
                const actionType = type === 'cert' ? 'upload_rs_cert' : 'upload_correction_file';
                const label = type === 'cert' ? 'ใบรับรอง' : 'ไฟล์แจ้งแก้ไข';

                if (!confirm(`ยืนยันการอัปโหลด ${label} สำหรับ: ${name}?`)) return;

                setIsUploading(true); 
                setUploadProgress(0);
                
                try {
                    let p = 0;
                    const interval = setInterval(() => { p += 10; if(p > 90) p = 90; setUploadProgress(p); }, 300);
                    
                    const base64 = await fileToBase64(uploadFile);
                    
                    const result = await api.submitData({ 
                        action: actionType, 
                        rowId, 
                        name, 
                        fiscal_year, 
                        fileData: base64.data 
                    });
                    
                    clearInterval(interval);
                    
                    if (result.status === 'success') {
                        setUploadProgress(100);
                        setTimeout(() => { 
                            alert(`อัปโหลด ${label} สำเร็จ`); 
                            setUploadFile(null); 
                            setIsUploading(false); 
                            refreshData(); 
                        }, 500);
                    } else { throw new Error(result.message); }
                } catch (e) { 
                    console.error(e); 
                    alert('Upload Failed: ' + e.message); 
                    setIsUploading(false); 
                }
            };

            const filtered = requests.filter(r => {
                const matchStatus = filterStatus === 'all' || r.status === filterStatus;
                const matchName = !filterName || r.name.toLowerCase().includes(filterName.toLowerCase());
                const matchAffiliation = !filterAffiliation || r.affiliation === filterAffiliation;
                const matchYear = !filterYear || String(r.fiscal_year) === String(filterYear);
                return matchStatus && matchName && matchAffiliation && matchYear;
            });

            const toggleExpand = (i) => { setExpanded(expanded === i ? null : i); setUploadFile(null); };
            
            const stats = {
                total: requests.length,
                checking: requests.filter(r => r.status === 'checking').length,
                committee: requests.filter(r => r.status === 'committee').length,
                correction: requests.filter(r => r.status === 'correction').length,
                rejected: requests.filter(r => r.status === 'rejected').length,
                approved: requests.filter(r => r.status === 'approved').length
            };

            return (
                <div className="max-w-7xl mx-auto px-4 py-8">
                    <EditRequestModal isOpen={isEditModalOpen} onClose={() => setIsEditModalOpen(false)} request={editData} onSave={handleSaveEdit} />
                    <ProgressModal isOpen={isUploading} progress={uploadProgress} text="กำลังอัปโหลดไฟล์..." />
                    
                    <div className="flex justify-between mb-8">
                        <h2 className="text-2xl font-bold flex items-center"><Icon name="ShieldCheck" className="mr-2"/> ระบบจัดการหลังบ้าน</h2>
                        <button onClick={refreshData} className="flex items-center gap-2 bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700"><Icon name="RefreshCw" size={18}/> อัปเดต</button>
                    </div>

                     {/* Stats Dashboard */}
                     <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4 mb-8">
                        <div className="bg-white p-4 rounded-lg shadow border border-gray-200"><p className="text-xs text-gray-500">ทั้งหมด</p><p className="text-2xl font-bold">{stats.total}</p></div>
                        <div className="bg-blue-50 p-4 rounded-lg shadow border border-blue-200"><p className="text-xs text-blue-600">รอตรวจสอบ</p><p className="text-2xl font-bold text-blue-700">{stats.checking}</p></div>
                        <div className="bg-purple-50 p-4 rounded-lg shadow border border-purple-200"><p className="text-xs text-purple-600">กรรมการ</p><p className="text-2xl font-bold text-purple-700">{stats.committee}</p></div>
                        <div className="bg-orange-50 p-4 rounded-lg shadow border border-orange-200"><p className="text-xs text-orange-600">แก้ไข</p><p className="text-2xl font-bold text-orange-700">{stats.correction}</p></div>
                        <div className="bg-red-50 p-4 rounded-lg shadow border border-red-200"><p className="text-xs text-red-600">ไม่รับรอง</p><p className="text-2xl font-bold text-red-700">{stats.rejected}</p></div>
                        <div className="bg-green-50 p-4 rounded-lg shadow border border-green-200"><p className="text-xs text-green-600">อนุมัติ</p><p className="text-2xl font-bold text-green-700">{stats.approved}</p></div>
                    </div>

                    {/* Filters Section */}
                    <div className="bg-white p-4 rounded-lg shadow-sm border mb-6">
                        <h3 className="text-sm font-bold text-gray-700 mb-3 flex items-center"><Icon name="Filter" size={16} className="mr-2"/> ตัวกรองข้อมูล</h3>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <div>
                                <label className="text-xs text-gray-500 mb-1 block">ชื่อนักวิจัย</label>
                                <input type="text" value={filterName} onChange={(e) => setFilterName(e.target.value)} placeholder="ค้นหาชื่อ..." className="w-full border rounded p-2 text-sm" />
                            </div>
                            <div>
                                <label className="text-xs text-gray-500 mb-1 block">สังกัด</label>
                                <select value={filterAffiliation} onChange={(e) => setFilterAffiliation(e.target.value)} className="w-full border rounded p-2 text-sm">
                                    <option value="">ทั้งหมด</option>
                                    {AFFILIATIONS.map(aff => <option key={aff} value={aff}>{aff}</option>)}
                                </select>
                            </div>
                            <div>
                                <label className="text-xs text-gray-500 mb-1 block">ปีงบประมาณ</label>
                                <select value={filterYear} onChange={(e) => setFilterYear(e.target.value)} className="w-full border rounded p-2 text-sm">
                                    <option value="">ทั้งหมด</option>
                                    {uniqueYears.map(y => <option key={y} value={y}>{y}</option>)}
                                </select>
                            </div>
                        </div>
                    </div>

                    <div className="flex flex-wrap gap-2 mb-4">
                        <button onClick={()=>setFilterStatus('all')} className={`px-4 py-2 rounded-full text-xs border ${filterStatus==='all'?'bg-gray-800 text-white':'bg-white'}`}>สถานะทั้งหมด</button>
                        {Object.entries(STATUS_OPTIONS).map(([k,v])=><button key={k} onClick={()=>setFilterStatus(k)} className={`px-4 py-2 rounded-full text-xs border ${filterStatus===k?v.color.replace('text-','bg-').split(' ')[0]+' text-white':'bg-white'}`}>{v.label.split('. ')[1]}</button>)}
                    </div>
                    
                    <div className="bg-white rounded-xl shadow overflow-hidden">
                        <table className="w-full text-left text-sm">
                            <thead className="bg-gray-50 border-b">
                                <tr>
                                    <th className="p-4 w-10"></th>
                                    <th className="p-4">วันที่/รหัส</th>
                                    <th className="p-4">ผู้ขอ/สังกัด</th>
                                    <th className="p-4">โครงการ</th>
                                    <th className="p-4">สถานะ</th>
                                    <th className="p-4">จัดการ</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y">
                                {filtered.length === 0 ? (
                                    <tr><td colSpan="6" className="p-8 text-center text-gray-500">ไม่พบข้อมูลตามเงื่อนไขที่ระบุ</td></tr>
                                ) : filtered.map((r, i) => (
                                    <React.Fragment key={i}>
                                        <tr className={`hover:bg-blue-50 ${expanded===i?'bg-blue-50':''}`}>
                                            <td className="p-4 text-center"><button onClick={()=>toggleExpand(i)}><Icon name={expanded===i?"ChevronDown":"ChevronRight"} size={20}/></button></td>
                                            <td className="p-4 align-top whitespace-nowrap"><div>{new Date(r.submittedAt).toLocaleDateString('th-TH')}</div><div className="text-xs font-mono text-gray-500 bg-gray-100 px-1 rounded inline-block mt-1">{r.id}</div></td>
                                            <td className="p-4 align-top"><div>{r.name}</div><div className="text-xs text-gray-500">{r.affiliation}</div></td>
                                            <td className="p-4 align-top">{r.project_title}</td>
                                            <td className="p-4 align-top"><span className={`px-2 py-1 rounded text-xs border ${(STATUS_OPTIONS[r.status]||STATUS_OPTIONS.checking).color}`}>{(STATUS_OPTIONS[r.status]||STATUS_OPTIONS.checking).label.split('. ')[1]}</span></td>
                                            <td className="p-4 align-top flex gap-2">
                                                <button onClick={() => openEditModal(r)} className="text-blue-600 hover:text-blue-800 mr-2" title="แก้ไขข้อมูล"><Icon name="Edit3" size={16}/></button>
                                                <select value={r.status} onChange={(e)=>handleUpdate(r.rowId, e.target.value)} className="border rounded p-1 text-xs max-w-[120px]">{Object.entries(STATUS_OPTIONS).map(([k,v])=><option key={k} value={k}>{v.label}</option>)}</select>
                                                <button onClick={()=>handleDelete(r.rowId)} className="text-red-500 ml-1"><Icon name="Trash2" size={16}/></button>
                                            </td>
                                        </tr>
                                        {expanded === i && (
                                            <tr className="bg-gray-50">
                                                <td colSpan="6" className="p-6 border-b shadow-inner">
                                                    <div className="grid md:grid-cols-2 gap-8">
                                                        {/* Left Column: Admin Uploads */}
                                                        <div className="border-r pr-6 space-y-6">
                                                            <h4 className="font-bold text-gray-800 border-b pb-2">ส่วนเจ้าหน้าที่</h4>
                                                            
                                                            {/* Correction Section (Orange) */}
                                                            <div className="p-4 bg-orange-50 border border-orange-200 rounded-lg">
                                                                <div className="flex items-center gap-2 mb-3 text-orange-800 font-bold">
                                                                    <Icon name="Edit3" size={16}/> ส่วนแจ้งแก้ไข (สำหรับสถานะ: ส่งกลับแก้ไข)
                                                                </div>
                                                                
                                                                <div className="mb-3">
                                                                    <label className="text-xs font-bold text-gray-600 mb-1 block">บันทึกแจ้งนักวิจัย</label>
                                                                    <textarea 
                                                                        className="w-full text-xs p-2 border rounded focus:ring-2 focus:ring-orange-300 outline-none" 
                                                                        rows="3" 
                                                                        placeholder="ระบุรายละเอียดการแก้ไขที่นี่..."
                                                                        value={correctionNotes[r.rowId] !== undefined ? correctionNotes[r.rowId] : (r.correction_note || '')}
                                                                        onChange={(e) => handleNoteChange(r.rowId, e.target.value)}
                                                                    ></textarea>
                                                                </div>

                                                                <div className="flex items-center justify-between mb-2">
                                                                    <label className="text-xs font-bold text-gray-600">ไฟล์แจ้งแก้ไข</label>
                                                                    {r.file_correction && <a href={r.file_correction} target="_blank" className="text-xs text-blue-600 underline">ดูไฟล์ปัจจุบัน</a>}
                                                                </div>
                                                                <div className="flex gap-2">
                                                                    <input type="file" accept=".pdf" onChange={(e) => setUploadFile(e.target.files[0])} className="text-xs w-full file:mr-2 file:py-1 file:px-2 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-white file:text-orange-700 hover:file:bg-orange-100" />
                                                                    <button onClick={() => handleFileUpload(r.rowId, r.name, r.fiscal_year, 'correction')} disabled={isUploading || !uploadFile} className={`whitespace-nowrap px-3 py-1 rounded text-xs text-white ${isUploading ? 'bg-gray-400' : 'bg-orange-600 hover:bg-orange-700'}`}>อัปโหลด</button>
                                                                </div>
                                                            </div>

                                                            {/* Certificate Section (Green) */}
                                                            <div className="p-4 bg-green-50 border border-green-200 rounded-lg">
                                                                <div className="flex items-center gap-2 mb-3 text-green-800 font-bold">
                                                                    <Icon name="Award" size={16}/> ส่วนใบรับรอง (สำหรับสถานะ: อนุมัติ)
                                                                </div>
                                                                <div className="flex items-center justify-between mb-2">
                                                                    <label className="text-xs font-bold text-gray-600">ใบรับรองงานวิจัย</label>
                                                                    {r.file_rs_cert && <a href={r.file_rs_cert} target="_blank" className="text-xs text-blue-600 underline">ดูไฟล์ปัจจุบัน</a>}
                                                                </div>
                                                                <div className="flex gap-2">
                                                                    <input type="file" accept=".pdf" onChange={(e) => setUploadFile(e.target.files[0])} className="text-xs w-full file:mr-2 file:py-1 file:px-2 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-white file:text-green-700 hover:file:bg-green-100" />
                                                                    <button onClick={() => handleFileUpload(r.rowId, r.name, r.fiscal_year, 'cert')} disabled={isUploading || !uploadFile} className={`whitespace-nowrap px-3 py-1 rounded text-xs text-white ${isUploading ? 'bg-gray-400' : 'bg-green-600 hover:bg-green-700'}`}>อัปโหลด</button>
                                                                </div>
                                                            </div>
                                                        </div>

                                                        {/* Right Column: User Info & Files */}
                                                        <div>
                                                            <h4 className="font-bold mb-4 text-gray-800 border-b pb-2">ข้อมูลผู้ขอ & ไฟล์แนบ</h4>
                                                            <div className="grid grid-cols-2 gap-4 text-sm mb-4">
                                                                <div><span className="text-gray-500 block">อีเมล</span>{r.email}</div>
                                                                <div><span className="text-gray-500 block">โทรศัพท์</span>{r.tel}</div>
                                                                <div><span className="text-gray-500 block">ตำแหน่ง</span>{r.academic_position}</div>
                                                                <div><span className="text-gray-500 block">สาขา</span>{r.branch}</div>
                                                            </div>
                                                            <div className="grid gap-2">
                                                                {['file_report', 'file_self_assess', 'file_sp10', 'file_sp10_1', 'file_cert', 'file_plagiarism'].map(k => (
                                                                    <div key={k} className="flex items-center justify-between text-sm bg-gray-50 p-2 rounded border">
                                                                        <span className="flex items-center text-gray-600 truncate mr-2" title={FILE_LABELS[k] || k}>
                                                                            <Icon name="FileText" size={14} className="mr-2 inline"/> {FILE_LABELS[k] || k}
                                                                        </span>
                                                                        {r[k] ? (
                                                                            <a href={r[k]} target="_blank" className="flex items-center px-3 py-1 bg-white border rounded text-xs font-bold text-blue-600 hover:bg-blue-50 hover:text-blue-800 transition shadow-sm whitespace-nowrap">
                                                                                <Icon name="Download" size={12} className="mr-1"/> ไฟล์
                                                                            </a>
                                                                        ) : <span className="text-xs text-red-400">ไม่พบไฟล์</span>}
                                                                    </div>
                                                                ))}
                                                            </div>
                                                        </div>
                                                    </div>
                                                </td>
                                            </tr>
                                        )}
                                    </React.Fragment>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        };

        // --- APP ROOT ---
        const App = () => {
            const [activeTab, setActiveTab] = useState('home');
            const [isAdmin, setIsAdmin] = useState(false);
            const [requests, setRequests] = useState([]);
            const [searchId, setSearchId] = useState(null);

            const refreshData = async () => { 
                const data = await api.fetchData(); 
                if(data.length) setRequests(data.sort((a,b)=>b.rowId-a.rowId)); 
            };
            
            useEffect(() => { 
                refreshData(); 
                const params = new URLSearchParams(window.location.search);
                const tab = params.get('tab');
                const id = params.get('id');
                
                if (tab === 'status') { 
                    setActiveTab('status'); 
                    if (id) setSearchId(id); 
                }
            }, []);

            return (
                <div className="min-h-screen flex flex-col">
                    <Navbar activeTab={activeTab} setActiveTab={setActiveTab} isAdmin={isAdmin} setIsAdmin={setIsAdmin} />
                    <main className="flex-grow">
                        {activeTab === 'home' && <><HeroSection /><ProcessSteps /><RelatedDocuments /><ContactSection /></>}
                        {activeTab === 'register' && <RegistrationForm setActiveTab={setActiveTab} requests={requests} refreshData={refreshData} />}
                        {activeTab === 'status' && <StatusCheck requests={requests} initialSearchId={searchId} />}
                        {activeTab === 'admin' && isAdmin && <AdminDashboard requests={requests} refreshData={refreshData} />}
                        {isAdmin && activeTab === 'home' && <div className="text-center mt-4"><button onClick={()=>setActiveTab('admin')} className="text-blue-600 underline">ไปที่หน้าจัดการข้อมูล</button></div>}
                    </main>
                    <Footer />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
